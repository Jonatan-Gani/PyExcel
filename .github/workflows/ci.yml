name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Cross-platform (netstandard2.0 + kernel tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Python is set up before `dotnet test` so the KernelSupervisor
      # integration tests can spawn `python -m pyexcel.kernel`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python kernel dependencies
        # Kernel runtime requires pyarrow/pandas/numpy (see requirements.txt).
        # plotly/matplotlib are intentionally excluded until worker.py needs them —
        # they add ~150 MB to the CI install for no test benefit yet.
        run: python -m pip install --upgrade pip pytest pyarrow pandas numpy

      - name: Build PyExcel.Common (netstandard2.0)
        run: >-
          dotnet build src/PyExcel.Common/PyExcel.Common.csproj
          --framework netstandard2.0 --configuration Release

      - name: Build PyExcel.Bridge (netstandard2.0)
        run: >-
          dotnet build src/PyExcel.Bridge/PyExcel.Bridge.csproj
          --framework netstandard2.0 --configuration Release

      - name: Build PyExcel.Kernel.Client (netstandard2.0)
        run: >-
          dotnet build src/PyExcel.Kernel.Client/PyExcel.Kernel.Client.csproj
          --framework netstandard2.0 --configuration Release

      - name: Test PyExcel.Bridge (framing + kernel + client integration)
        run: >-
          dotnet test tests/PyExcel.Bridge.Tests/PyExcel.Bridge.Tests.csproj
          --configuration Release

      - name: Run kernel tests
        run: pytest tests/ -v

  windows:
    name: Full solution (net48)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Python is required for the integration tests: KernelSupervisorTests
      # and KernelClientTests both spawn `python -m pyexcel.kernel` and
      # exercise the Win32 named-pipe client end-to-end.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python kernel dependencies
        run: python -m pip install --upgrade pip pyarrow pandas numpy
        shell: pwsh

      - name: Restore
        run: dotnet restore PyExcel.sln

      - name: Build
        run: dotnet build PyExcel.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/PyExcel.Bridge.Tests/PyExcel.Bridge.Tests.csproj --configuration Release --no-build
