name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Common (netstandard2.0) + kernel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build PyExcel.Common (netstandard2.0)
        run: >-
          dotnet build src/PyExcel.Common/PyExcel.Common.csproj
          --framework netstandard2.0 --configuration Release

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run kernel tests
        run: pytest tests/ -v

  windows:
    name: Full solution (net48)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PyExcel.sln

      - name: Build
        run: dotnet build PyExcel.sln --configuration Release --no-restore
