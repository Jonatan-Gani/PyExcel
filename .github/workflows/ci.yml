name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Cross-platform (netstandard2.0 + kernel tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Python is set up before `dotnet test` so the KernelSupervisor
      # integration tests can spawn `python -m pyexcel.kernel`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python kernel dependencies
        # The full requirements.txt set: pyarrow/pandas/numpy for the data
        # plane, plotly/matplotlib for the Phase 6 chart pipeline (figure →
        # chart spec / image tests in tests/kernel/test_chart.py and the
        # PyRunTests chart round-trips).
        run: python -m pip install --upgrade pip pytest pyarrow pandas numpy plotly matplotlib

      - name: Build PyExcel.Common (netstandard2.0)
        run: >-
          dotnet build src/PyExcel.Common/PyExcel.Common.csproj
          --framework netstandard2.0 --configuration Release

      - name: Build PyExcel.Bridge (netstandard2.0)
        run: >-
          dotnet build src/PyExcel.Bridge/PyExcel.Bridge.csproj
          --framework netstandard2.0 --configuration Release

      - name: Build PyExcel.Kernel.Client (netstandard2.0)
        run: >-
          dotnet build src/PyExcel.Kernel.Client/PyExcel.Kernel.Client.csproj
          --framework netstandard2.0 --configuration Release

      - name: Build PyExcel.Excel (netstandard2.0)
        run: >-
          dotnet build src/PyExcel.Excel/PyExcel.Excel.csproj
          --framework netstandard2.0 --configuration Release

      - name: Build PyExcel.State (netstandard2.0)
        run: >-
          dotnet build src/PyExcel.State/PyExcel.State.csproj
          --framework netstandard2.0 --configuration Release

      - name: Build PyExcel.Setup (netstandard2.0)
        run: >-
          dotnet build src/PyExcel.Setup/PyExcel.Setup.csproj
          --framework netstandard2.0 --configuration Release

      - name: Test PyExcel.Bridge (framing + kernel + client + marshal + state + setup)
        run: >-
          dotnet test tests/PyExcel.Bridge.Tests/PyExcel.Bridge.Tests.csproj
          --configuration Release

      - name: Run kernel tests
        run: pytest tests/ -v

  windows:
    name: Full solution (net48)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Python is required for the integration tests: KernelSupervisorTests
      # and KernelClientTests both spawn `python -m pyexcel.kernel` and
      # exercise the Win32 named-pipe client end-to-end.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python kernel dependencies
        run: python -m pip install --upgrade pip pyarrow pandas numpy plotly matplotlib
        shell: pwsh

      - name: Restore
        run: dotnet restore PyExcel.sln

      - name: Build
        run: dotnet build PyExcel.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/PyExcel.Bridge.Tests/PyExcel.Bridge.Tests.csproj --configuration Release --no-build
